<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AFROCUTS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>AFROCUTS — Afro-Barber finden & buchen</title>
<style>
:root{--bg:#1E1613;--surface:#2A211C;--surface-2:#34281F;--text:#F5EDE4;--muted:#B8A99C;--gold:#C9A227;--gold-l:#E4C468;--red:#8B2E2E;--sage:#4C6D61;--line:#4a3a2e;--ok:#9fd8b9;--warn:#e6b17e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;min-height:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--gold-l)}
.app{max-width:520px;margin:0 auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(30,22,19,.96);backdrop-filter:blur(8px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:20px;letter-spacing:2px;color:var(--gold-l)}
.back{width:34px;height:34px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0}
.title{font-weight:700;font-size:15px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:20px}
.view{padding:14px 16px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.click{cursor:pointer}
.card.click:active{transform:scale(.985)}
.row{display:flex;gap:12px;align-items:center}
.thumb{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#5c4326,#241a14);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.name{font-weight:700;font-size:15px}
.meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.badge{display:inline-block;background:#2f4239;color:var(--ok);font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:700;margin-top:6px}
.badge.warn{background:#4a2e20;color:var(--warn)}
.badge.red{background:#4a2020;color:#e2958f}
.badge.blue{background:#2f3f42;color:#9fd0d8}
.sec{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px}
.btn{width:100%;background:var(--gold);color:#221904;border:none;padding:14px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;text-align:center;font-family:inherit}
.btn:disabled{opacity:.45}
.btn.sec2{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.small{padding:9px 12px;font-size:12px;width:auto;border-radius:10px}
.btn.ok{background:var(--sage);color:#fff}
.btn.danger{background:transparent;border:1px solid var(--red);color:#e2958f}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 70%,transparent);z-index:15}
.sticky .in{max-width:520px;margin:0 auto}
label.l{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;font-weight:700}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--text);font-size:15px;font-family:inherit;color-scheme:dark}
input[type=time]{padding:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:13px}
.opt.on{background:var(--gold);border-color:var(--gold);color:#221904;font-weight:800}
.opt.dis{opacity:.28;pointer-events:none;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#221904;font-weight:700}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.svc.on{border-color:var(--gold);background:var(--surface-2)}
.svc .p{font-weight:700;color:var(--gold-l);font-variant-numeric:tabular-nums}
.stylist{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer}
.stylist.on{border-color:var(--gold);background:var(--surface-2)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#5c4326,#241a14);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.daynav .arrow{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.daynav .arrow.dis{opacity:.25;pointer-events:none}
.daynav .lbl{text-align:center}
.daynav .lbl b{font-size:17px;display:block}
.daynav .lbl span{font-size:12px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.empty{grid-column:1/-1;text-align:center;padding:26px 10px;color:var(--muted);font-size:13px;line-height:1.5}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.lock{background:#22322b;border:1px solid #375247;border-radius:12px;padding:11px 13px;font-size:12px;color:#a9cbb9;line-height:1.5;margin:10px 0}
.warnbox{background:#3a2e10;border:1px solid var(--gold);border-radius:12px;padding:11px 13px;font-size:12px;color:#e4c987;line-height:1.5;margin:10px 0}
.lossbox{background:#3a1f1c;border:1px solid var(--red);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#f2b7ab;line-height:1.5;margin:10px 0}
.err{background:#3a1f1c;border:1px solid var(--red);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#f2b7ab;line-height:1.5;margin:10px 0}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:13px;color:var(--muted);margin-top:14px}
.summary b{color:var(--text)}
.prow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--muted)}
.prow b{color:var(--text)}
.hr{height:1px;background:var(--line);margin:8px 0}
.big{font-size:22px;font-weight:800;color:var(--gold-l);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{flex-shrink:0;padding:9px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);text-align:center;line-height:1.25}
.tab.on{background:var(--gold);color:#221904;border-color:var(--gold)}
.tab.closed{opacity:.35}
.tab .d{font-size:9.5px;opacity:.8;display:block}
.tab .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--gold-l);margin:3px auto 0}
.tab.on .dot{background:#221904}
.avail{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.avail .h{display:flex;background:var(--surface-2);border-bottom:1px solid var(--line)}
.avail .h div{flex:1;text-align:center;font-size:10.5px;color:var(--muted);padding:9px 2px;font-weight:700;cursor:pointer}
.avail .h div:first-child{flex:0 0 54px;text-align:left;padding-left:12px;cursor:default}
.avail .h .off{display:block;font-size:8px;color:var(--warn)}
.avail .r{display:flex;border-bottom:1px solid var(--line);align-items:center}
.avail .r:last-child{border-bottom:none}
.avail .t{flex:0 0 54px;font-size:11.5px;color:var(--muted);padding-left:12px;font-variant-numeric:tabular-nums}
.avail .c{flex:1;display:flex;justify-content:center;padding:8px 0}
.dot2{width:24px;height:24px;border-radius:8px;background:var(--gold);cursor:pointer}
.dot2.off{background:var(--surface-2);border:1px solid var(--line)}
.dot2.busy{background:var(--red);cursor:default;position:relative}
.avail .r.busyrow{background:rgba(139,46,46,.12)}
.availbk{font-size:10px;color:#e2958f;padding:2px 0 0;text-align:center;line-height:1.2}
.legend i.busy{background:var(--red)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30}
.nav .in{max-width:520px;margin:0 auto;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav .it{flex:1;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;padding:4px 0}
.nav .it.logout-it,.tabs .tab.logout-it{color:#e2958f}
.nav .it.on{color:var(--gold-l);font-weight:700}
.nav .it div{font-size:20px;margin-bottom:2px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.bk .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bk .tm{font-weight:800;color:var(--gold-l);font-size:15px;font-variant-numeric:tabular-nums}
.bk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stat{display:flex;gap:10px}
.stat .s{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px}
.stat .v{font-size:19px;font-weight:800;color:var(--gold-l)}
.stat .k{font-size:10.5px;color:var(--muted);margin-top:2px}
.rowline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rowline input{flex:1;min-width:0;padding:9px 10px;font-size:14px}
.rowline .x{color:#e2958f;cursor:pointer;padding:0 4px;font-size:18px}
.dayrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:none}
.dayrow .n{width:78px;font-size:13px;font-weight:600}
.sw{position:relative;width:40px;height:23px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;cursor:pointer}
.sw span:before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--gold);border-color:var(--gold)}
.sw input:checked+span:before{transform:translateX(17px);background:#221904}
.dayrow .times{display:flex;gap:6px;flex:1;align-items:center;opacity:.25;pointer-events:none}
.dayrow .times.on{opacity:1;pointer-events:auto}
.dayrow .times input{width:0;flex:1;font-size:12px}
.qr{background:#fff;border-radius:16px;padding:14px;width:240px;margin:16px auto 0;display:block}
.code{text-align:center;font-family:ui-monospace,Menlo,monospace;letter-spacing:3px;font-size:22px;color:var(--gold-l);margin-top:12px;font-weight:800}
.center{text-align:center}
.h1{font-size:24px;font-weight:900;letter-spacing:.5px}
.h2{font-size:18px;font-weight:800;margin-bottom:6px}
.check{width:70px;height:70px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:34px;margin:24px auto 16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--sage);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.toast.bad{background:var(--red)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{padding:22px 4px 8px}
.hero .h1{font-size:30px;color:var(--gold-l);letter-spacing:2px}
.hero p{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.5}
.testtag{display:inline-block;background:#4a2e20;color:var(--warn);font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;letter-spacing:1px;margin-left:8px;vertical-align:middle}

/* Magazine-Cover-Hero (Startseite) */
.hero2{padding:20px 4px 14px}
.hero2 .h1b{font-size:25px;font-weight:800;color:var(--gold-l);letter-spacing:.3px;line-height:1.25}
.hero2 p{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5}
.hero2.has-bg{min-height:300px;margin:0 -16px 4px;border-radius:0 0 22px 22px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:0 20px 18px}
.hero-bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease;z-index:0}
.hero-bg-layer.on{opacity:1}
.hero2.has-bg:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 0%,transparent 40%,rgba(12,9,7,.55) 72%,rgba(9,7,5,.92) 100%)}
.hero2.has-bg .h1b,.hero2.has-bg p{position:relative;z-index:2}
.hero2.has-bg .h1b{color:#fff;font-size:20px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6);line-height:1.25}
.hero2.has-bg p{color:#e9dfd0;font-size:12px;margin-top:4px}
.gal-loading{padding:30px 0;text-align:center}
.gal-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.gal-scroll::-webkit-scrollbar{display:none}
.gal-card{flex:0 0 auto;width:62vw;max-width:230px;aspect-ratio:4/5;border-radius:18px;overflow:hidden;position:relative;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.gal-card img{width:100%;height:100%;object-fit:cover;display:block}
.gal-card .gal-cap{position:absolute;left:0;right:0;bottom:0;padding:14px 12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);display:flex;flex-direction:column}
.gal-card .gal-cap b{color:#fff;font-size:13.5px}
.gal-card .gal-cap span{color:var(--gold-l);font-size:11px;margin-top:2px}
.thumb-ph{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
.profile-hero{width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.mini-hero{width:100%;aspect-ratio:21/7;border-radius:14px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.mini-hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-banner{position:relative;width:100%;min-height:150px;border-radius:16px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background-size:cover;background-position:center;display:flex;align-items:flex-end}
.hero-banner:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(10,7,5,.55) 65%,rgba(8,6,4,.9) 100%)}
.hb-text{position:relative;z-index:1;padding:14px 16px;width:100%}
.hb-text b{display:block;color:#fff;font-size:17px;font-weight:800;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.hb-text span{display:block;color:#e9dfd0;font-size:12px;margin-top:3px}
.profile-hero img{width:100%;height:100%;object-fit:cover;display:block}
.pf-preview{width:100%;max-width:220px;aspect-ratio:4/5;border-radius:14px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.pf-preview img{width:100%;height:100%;object-fit:cover;display:block}

/* TV- / Wartebereich-Anzeige */
.disp-body{background:var(--bg);min-height:100vh;padding:28px 22px}
.disp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.disp-head .nm{font-size:26px;font-weight:900;color:var(--gold-l);letter-spacing:1px}
.disp-head .dt{font-size:16px;color:var(--muted)}
.disp-clock{font-size:14px;color:var(--muted);margin-bottom:20px}
.disp-grid{display:grid;gap:10px}
.disp-col-head{font-size:15px;font-weight:800;color:var(--text);text-align:center;padding-bottom:6px;border-bottom:2px solid var(--line)}
.disp-row{display:grid;gap:10px;align-items:stretch}
.disp-hour{font-size:15px;color:var(--muted);display:flex;align-items:center;font-variant-numeric:tabular-nums;font-weight:700}
.disp-cell{border-radius:12px;padding:14px 8px;text-align:center;font-size:17px;font-weight:800}
.disp-cell.free{background:#22322b;color:var(--ok);border:1px solid #375247}
.disp-cell.busy{background:#3a1f1c;color:#e2958f;border:1px solid var(--red)}
.disp-full{background:var(--gold);color:#221904;border-radius:20px;padding:26px;text-align:center;margin:20px 0}
.disp-full .t1{font-size:24px;font-weight:900}
.disp-full .t2{font-size:15px;margin-top:6px;font-weight:600}
.disp-qr{background:#fff;border-radius:16px;padding:12px;width:150px;margin:16px auto 0;display:block}
.disp-legend{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:16px;justify-content:center}
.disp-legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* Chat */
.chat-box{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px 2px;margin-bottom:10px}
.chat-empty{text-align:center;color:var(--muted);font-size:12.5px;padding:16px 0}
.bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4}
.bubble.me{align-self:flex-end;background:var(--gold);color:#221904;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .tm2{font-size:10px;opacity:.65;margin-top:3px;display:block}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1}
.locbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--gold-l);cursor:pointer;white-space:nowrap}
@media print{.topbar,.nav,.sticky,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.app{max-width:none}.printsheet{padding:40px;text-align:center}.printsheet .code{color:#000}}
</style>
</head>
<body>
<div class="app" id="app"><div class="view" style="padding-top:60px" class="center"><span class="spinner"></span> Lädt …</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
